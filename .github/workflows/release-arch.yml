name: Release Arch package

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - apps/cosmic-coldfront/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - arch/**
      - scripts/check-version.sh
      - .github/workflows/release-arch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-arch-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install the toolchain and build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git github-cli cargo \
            pkgconf wayland libxkbcommon fontconfig freetype2 expat \
            vulkan-headers mesa libinput dbus

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record the Rust toolchain version
        id: rustc
        run: echo "version=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Ensure Cargo cache parent directories exist
        run: mkdir -p .cargo-cache/cargo-home .cargo-cache/target

      - name: Restore the Cargo cache
        uses: actions/cache@v4
        id: cargo-cache
        with:
          path: |
            .cargo-cache/cargo-home/registry/index
            .cargo-cache/cargo-home/registry/cache
            .cargo-cache/cargo-home/git/db
            .cargo-cache/target
          key: arch-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ steps.rustc.outputs.version }}
          restore-keys: |
            arch-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            arch-release-${{ runner.os }}-

      - name: Check the versions agree
        if: github.ref_type == 'tag'
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Build the package
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo-cache/cargo-home
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-cache/target
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pkgver=$(sed -n 's/^pkgver=//p' arch/PKGBUILD)
          git archive --prefix="coldfront-$pkgver/" \
            -o arch/"coldfront-$pkgver.tar.gz" HEAD
          useradd -m builder
          chown -R builder arch
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          chown -R builder:builder "$GITHUB_WORKSPACE/.cargo-cache"
          su builder -c "export CARGO_HOME='$CARGO_HOME' CARGO_TARGET_DIR='$CARGO_TARGET_DIR' CARGO_INCREMENTAL=0; cd arch && makepkg --noconfirm --nocheck"
          chown -R root:root "$GITHUB_WORKSPACE/.cargo-cache"
          mkdir -p dist
          cp arch/*.pkg.tar.zst dist/
          ls -l dist/

      - name: Upload the package as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: cosmic-coldfront-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.pkg.tar.zst --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.pkg.tar.zst \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
